[package]
name = "dirscan"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "基于字典的并发目录扫描工具"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["gzip", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
